name: Stale Triage

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark inactive issues and pull requests
    runs-on: ubuntu-24.04
    steps:
      - name: Mark stale items
        uses: actions/stale@v10
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 14
          days-before-pr-stale: 21
          days-before-pr-close: 14
          stale-issue-label: "status:stale"
          stale-pr-label: "status:stale"
          exempt-issue-labels: "security,reliability,good first issue,status:needs-response"
          exempt-pr-labels: "security,risk:security,risk:release,risk:protocol,status:changes-requested,status:needs-response"
          remove-stale-when-updated: true
          operations-per-run: 50
          stale-issue-message: |
            This issue has been inactive for 30 days and is marked `status:stale`.
            It will close in 14 days unless there is new information or maintainer activity.
          close-issue-message: |
            Closing this issue due to inactivity. Reopen or create a new issue if this is still reproducible.
          stale-pr-message: |
            This pull request has been inactive for 21 days and is marked `status:stale`.
            It will close in 14 days unless it is updated or a maintainer keeps it open.
          close-pr-message: |
            Closing this pull request due to inactivity. Reopen or create a fresh PR when it is ready to continue.
