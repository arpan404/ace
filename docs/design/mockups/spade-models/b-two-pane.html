  <span class="rm"><button class="pick${cur?"":" dflt"}" data-pick="${r.id}" aria-haspopup="listbox" aria-label="${r.name} model: ${cur?cur.m.name+", "+cur.p.name:r.modelDefault}">${show?`<span class="mark sm">${modelMark(show.m,show.p.brand,16)}</span>`:`<span class="mark sm subtle">${mark(null,16)}</span>`}<span class="pn">${cur?cur.m.name:r.modelDefault}</span><span class="subtle pa">${cur?cur.p.name:dflt?dflt.m.name:""}</span>${I.chevD}</button>${S.picker===r.id?picker(r):""}</span>
  <span class="re">${r.noEffort?"":`<select class="sel eff${r.effort?"":" dflt"}" aria-label="${r.name} thinking"><option${r.effort?"":" selected"}>Default: ${effortName(r.effortDefault)}</option>${EFFORTS.map(([v,l])=>`<option${r.effort===v?" selected":""}>${l}</option>`).join("")}</select>`}</span></div>`}).join("")}
 <div class="trow"><span class="tn label">Fallbacks</span><span class="rm muted">GPT-6.2 Mini, then Claude Sonnet 5.5</span><span class="re"><button class="textbtn">Change</button></span></div>
 </div></section>`}
function picker(r){
 const refs=allModelRefs().filter(x=>!S.pq||x.m.name.toLowerCase().includes(S.pq.toLowerCase()));
 const dflt=r.modelDefault;
 return `<div class="pop" role="listbox"><label class="search pops">${I.search}<input id="pq" aria-label="Search models" placeholder="Search models" value="${S.pq}"></label>
 ${dflt?`<button class="pitem on" data-pickdone>${dflt}<span class="grow"></span><span class="subtle">Default</span></button>`:""}
 ${PROVIDERS.map(p=>{const l=refs.filter(x=>x.p===p);if(!l.length) return "";return `<div class="plabel"><span class="mark xs">${mark(p.brand,14)}</span>${p.name}</div>`+l.map(x=>`<button class="pitem${x.ref===r.model?" on":""}" data-pickdone><span class="mark sm">${modelMark(x.m,p.brand,16)}</span>${x.m.name}<span class="grow"></span><span class="subtle">${p.accounts.length>1?x.a.name:""}</span></button>`).join("")}).join("")}</div>`}
function add(){
 const x=S.preset&&(PRESETS.find(p=>p.id===S.preset)||{id:"custom",name:"Custom endpoint",brand:null});
 let form="";
 if(x){let body;
  if(x.id==="openai") body=`<div class="kv"><span class="k">Sign in with</span><span class="v"><div class="word" role="group"><button aria-pressed="${S.how==="chatgpt"}" data-how="chatgpt">ChatGPT</button><button aria-pressed="${S.how==="key"}" data-how="key">API key</button></div></span></div>
   ${S.how==="key"?`<div class="kv"><span class="k">Key</span><input class="field v" placeholder="sk-…"></div>`:`<div class="kv"><span class="v muted">Bots on it use your ChatGPT plan. Using a ChatGPT sign-in outside OpenAI's own apps may go against OpenAI's terms.</span></div>`}`;
  else if(x.id==="ollama") body=`<div class="kv"><span class="k">Address</span><input class="field v mono" value="http://127.0.0.1:11434/v1/"></div>`;
  else if(x.id==="custom") body=`<div class="kv"><span class="k">Name</span><input class="field v" placeholder="My server"></div><div class="kv"><span class="k">Address</span><input class="field v mono" placeholder="https://…/v1/"></div><div class="kv"><span class="k">Key</span><input class="field v" placeholder="Only if it needs one"></div>`;
  else body=`<div class="kv"><span class="k">Key</span><input class="field v" placeholder="Paste your ${x.name} key"></div>`;
  form=`<section class="section"><div class="sechead"><h2>${x.name}</h2></div><div class="group">${body.replace(/class="kv"/g,'class="kv row"')}<div class="row"><span class="grow"></span><button class="btn primary">${x.id==="openai"&&S.how==="chatgpt"?"Sign in":"Add"}</button></div></div></section>`}
 return `<div class="dhead"><h2>Add a provider</h2></div>
 <section class="section"><div class="group grid">${PRESETS.map(p=>`<button class="gitem${S.preset===p.id?" on":""}" data-preset="${p.id}"><span class="mark">${mark(p.brand,20)}</span><span><div class="label">${p.name}</div><div class="desc">${p.how}</div></span></button>`).join("")}
 <button class="gitem wide${S.preset==="custom"?" on":""}" data-preset="custom"><span class="mark subtle">${mark(null,20)}</span><span><div class="label">Custom endpoint</div><div class="desc">Any OpenAI-compatible address</div></span></button></div></section>${form}`}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");
 if(!t){if(S.picker&&!e.target.closest(".pop")){S.picker=null;render()}return}
 const d=t.dataset;
 if(d.tab){go(d.tab);return}
 if(d.scheme){setScheme(d.scheme);document.querySelectorAll("[data-scheme]").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
 if(d.sel){S.sel=d.sel;S.query="";S.picker=null;S.preset=d.preset||null;S.tab=null}
 else if(d.preset){S.preset=d.preset}
 else if(d.toggle){S.open[d.toggle]=!S.open[d.toggle]}
 else if(d.acctab){S.acctTab[S.sel]=d.acctab}
 else if(d.how){S.how=d.how}
 else if(d.pick){S.picker=S.picker===d.pick?null:d.pick;S.pq=""}
 else if(d.pickdone!==undefined){S.picker=null}
 else if(t.hasAttribute("data-sw")){t.setAttribute("aria-checked",t.getAttribute("aria-checked")!=="true");return}
 else return;
 render();
});
document.addEventListener("input",e=>{const id=e.target.id;if(id==="q"||id==="pq"){S[id==="q"?"query":"pq"]=e.target.value;render();const q=document.getElementById(id);q.focus();q.setSelectionRange(q.value.length,q.value.length)}});
function go(tab){
 Object.assign(S,{tab,open:{},query:"",picker:null,preset:null,pq:""});
 if(tab==="overview") S.sel="anthropic";
 if(tab==="provider") S.sel="openrouter";
 if(tab==="account"){S.sel="openai";S.open["chatgpt-2"]=true;S.acctTab.openai="openai"}
 if(tab==="add"){S.sel="add";S.preset="openai"}
 if(tab==="roles"){S.sel="roles";S.picker="helper"}
 render();document.getElementById("main").scrollTop=0;
}
document.querySelector(".frame").innerHTML=shell();
{const [t,s]=location.hash.slice(1).split(",");if(s){setScheme(s);document.querySelectorAll("[data-scheme]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.scheme===s))}go(t||"overview")}
</script></body></html>
