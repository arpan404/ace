[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
axum = "0.8.9"
base64 = "0.23"
futures-util = "0.3.34"
genai = "0.7.3"
hmac = "0.13"
keyring-core = "1"
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "query",
  "rustls",
  "http2",
] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
  "fs",
] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
uuid = { version = "1", features = ["v4", "v7"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

# Reading a fetched page runs html5ever's tokenizer, which is generic and so compiled inside
# spade-fetch. Unoptimised, it is about twenty times slower than in release, which would make
# spade-fetch's time-bound tests measure the debug build instead of the code. These crates build
# optimised in dev too; tendril's debug assertions re-validate whole buffers, so they are off.
[profile.dev.package.spade-fetch]
opt-level = 3

[profile.dev.package.html5ever]
opt-level = 3
debug-assertions = false

[profile.dev.package.markup5ever]
opt-level = 3
debug-assertions = false

[profile.dev.package.tendril]
opt-level = 3
debug-assertions = false
