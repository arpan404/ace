[package]
name = "spade-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
hmac.workspace = true
jiff.workspace = true
sha2.workspace = true
tempfile.workspace = true
axum.workspace = true
chrono.workspace = true
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
spade-core = { path = "../spade-core" }
spade-keys = { path = "../spade-keys" }
spade-models = { path = "../spade-models" }
spade-ace = { path = "../spade-ace" }
spade-connect = { path = "../spade-connect" }
spade-mcp = { path = "../spade-mcp" }
spade-fetch = { path = "../spade-fetch" }
spade-docs = { path = "../spade-docs" }
spade-search = { path = "../spade-search" }
spade-store = { path = "../spade-store" }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
cap-std = "4.0.3"
cap = "0.1.2"
cap-fs-ext = "4.0.3"

[features]
# Timing hooks only tests may use (`Shell::with_end_delay`, `Terminals::with_end_deadline`); off
# in every release build.
test-hooks = []

[dev-dependencies]
# Spade's own tests turn its test hooks on.
spade-server = { path = ".", features = ["test-hooks"] }
keyring-core.workspace = true
reqwest = { workspace = true, features = ["stream"] }
# To make the test database refuse chosen writes.
rusqlite.workspace = true
# For the fake daemon MCP endpoint shared with spade-ace's tests.
rmcp = { version = "3.9.0", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
spade-testkit = { path = "../spade-testkit" }
spade-docs = { path = "../spade-docs" }
url = "2"
tokio-util = "0.7"
# Fake daemon WebSockets: routines' ace events, and the skill library shared with spade-ace's
# tests.
tokio-tungstenite = "0.30.0"
tower = "0.5"

[lints]
workspace = true

[target."cfg(unix)".dependencies]
# Each bot's persistent terminal (ADR 0142).
portable-pty = "0.9"
# Moves that never replace (renameat2 / renamex_np) and cleaning up what a command left (ADR 0142).
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target."cfg(target_os = \"macos\")".dependencies]
# Each process's start time to the microsecond, its parent, group and state (ADR 0142).
libproc = "0.14"

[target."cfg(windows)".dependencies]
win32job = "2.1.0"
