[package]
name = "spade-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
hmac.workspace = true
jiff.workspace = true
sha2.workspace = true
tempfile.workspace = true
axum.workspace = true
chrono.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
spade-core = { path = "../spade-core" }
spade-keys = { path = "../spade-keys" }
spade-models = { path = "../spade-models" }
spade-ace = { path = "../spade-ace" }
spade-fetch = { path = "../spade-fetch" }
spade-search = { path = "../spade-search" }
spade-store = { path = "../spade-store" }
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
keyring-core.workspace = true
reqwest = { workspace = true, features = ["stream"] }
# To make the test database refuse chosen writes.
rusqlite.workspace = true
# For the fake daemon MCP endpoint shared with spade-ace's tests.
rmcp = { version = "3.9.0", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
spade-testkit = { path = "../spade-testkit" }
tokio-util = "0.7"
# A fake daemon WebSocket for routines' ace events.
tokio-tungstenite = "0.30.0"
tower = "0.5"

[lints]
workspace = true
