[package]
name = "spade-sandbox-windows"
version = "0.1.0"
description = "The Windows system calls behind Spade's sandbox (ADR 0167): AppContainer profiles, ACLs on opened objects, job objects and the launch. The one Spade crate allowed `unsafe`."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }
tokio = { workspace = true, features = ["net", "rt"] }

# The workspace forbids `unsafe`; this crate is the exception, so its lints are spelled out:
# every unsafe block carries a `SAFETY` comment.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
