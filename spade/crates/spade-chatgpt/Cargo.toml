[package]
name = "spade-chatgpt"
version = "0.1.0"
description = "Spade signs in to OpenAI with a ChatGPT account and keeps its tokens in the keychain (ADR 0213)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
serde_json.workspace = true
spade-connect = { path = "../spade-connect" }
spade-keys = { path = "../spade-keys" }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "net", "io-util"] }
tracing.workspace = true
url = "2"

[dev-dependencies]
keyring-core.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
spade-testkit = { path = "../spade-testkit" }

[lints]
workspace = true
