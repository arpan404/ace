[package]
name = "spade-testkit"
version = "0.1.0"
description = "Test-only helpers for Spade: a fake model endpoint and a fake app MCP server with OAuth"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
rmcp = { version = "3.9.0", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
ring = "0.17"
sha2.workspace = true
spade-cloud-wire = { path = "../spade-cloud-wire" }
tokio-util = "0.7"
tower = "0.5"
futures-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "net", "rt"] }

[lints]
workspace = true
