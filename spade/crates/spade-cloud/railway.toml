# Railway config for Spade Cloud (spade/docs/cloud.md, "Deploying"). The service's Root Directory
# is `spade`; this file is its config-as-code path, /spade/crates/spade-cloud/railway.toml.

[build]
builder = "DOCKERFILE"
dockerfilePath = "crates/spade-cloud/Dockerfile"
watchPatterns = [
  "/spade/crates/spade-cloud/**",
  "/spade/crates/spade-cloud-wire/**",
  "/spade/Cargo.lock",
]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Sign-ins in progress are held in memory: one replica until they move to a shared store.
numReplicas = 1
overlapSeconds = 20
drainingSeconds = 30
