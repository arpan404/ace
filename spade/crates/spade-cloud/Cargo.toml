[package]
name = "spade-cloud"
version = "0.1.0"
description = "Spade Cloud (ADR 0139): Spade's hosted backend at cloud.acehq.dev, first the OAuth broker for apps whose sign-in needs a client secret"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spade-cloud"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["form"] }
ring = "0.17"
serde.workspace = true
serde_json.workspace = true
spade-cloud-wire = { path = "../spade-cloud-wire" }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
reqwest = { workspace = true, features = ["json", "query"] }

[lints]
workspace = true
