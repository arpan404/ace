[package]
name = "spade-ace"
version = "0.1.0"
description = "Spade's bridge to the local ace daemon: ace's tools over MCP and its skill library"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true, features = ["sink"] }
reqwest.workspace = true
rmcp = { version = "3.9.0", default-features = false, features = ["base64", "client", "transport-streamable-http-client-reqwest"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing.workspace = true

[dev-dependencies]
axum.workspace = true
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio-util = "0.7"

[lints]
workspace = true
