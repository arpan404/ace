[package]
name = "spade-sandbox"
version = "0.1.0"
description = "Spade's OS sandbox for a bot's commands, its credential deny-list and its egress proxy (ADR 0167)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "rt", "fs"] }
tracing.workspace = true
uuid.workspace = true
spade-sandbox-windows = { path = "../spade-sandbox-windows" }

[target."cfg(target_os = \"linux\")".dependencies]
# Linux's sandbox (ADR 0167 decision 1): a Landlock ruleset the launcher applies to itself.
landlock = { version = "0.4.4", optional = true }
# Carving opens each place relative to its folder without following links (`openat`).
rustix = { version = "1.1.6", features = ["fs"], optional = true }

[features]
# The Linux sandbox. Off by default until its network boundary (seccomp) is complete.
landlock = ["dep:landlock", "dep:rustix"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }

[lints]
workspace = true
