[package]
name = "spade-mcp"
version = "0.1.0"
description = "Spade's MCP client over streamable HTTP and stdio, for ace's tools, connectors and plugins"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
futures-util = { workspace = true, features = ["sink"] }
reqwest = { workspace = true, features = ["stream"] }
rmcp = { version = "3.9.0", default-features = false, features = [
  "base64",
  "client",
  "transport-streamable-http-client-reqwest",
  "transport-async-rw",
] }
serde_json.workspace = true
sse-stream = "0.2.6"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "process", "rt"] }

[target."cfg(unix)".dependencies]
# Ends a stdio server's whole process group.
rustix = { version = "1.1.6", features = ["process"] }

[target."cfg(windows)".dependencies]
# Holds a stdio server and what it starts in a kill-on-close job object.
win32job = "2.1.0"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
