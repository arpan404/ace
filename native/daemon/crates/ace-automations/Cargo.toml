[package]
name = "ace-automations"
description = "The automations scheduler behind @ace/automations (ADR 0225 A1): recurrence, next-run computation, catch-up and durable scheduling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# globset: file-trigger patterns match like Node's path.matchesGlob (a * does not cross /).
globset = "0.4"
# files-watch: A3 uses the files backend's own watcher instead of a second one.
files-watch = { path = "../../../files/crates/files-watch" }
files-safe = { path = "../../../files/crates/files-safe" }
files-list = { path = "../../../files/crates/files-list" }
files-io = { path = "../../../files/crates/files-io" }
# ace-store: both automation files open through the store's connection factory, so one SQLite
# library holds every file in the process and a home either backend wrote opens in the other.
ace-store = { path = "../ace-store" }
# aes-gcm: webhook secrets at rest are AES-256-GCM with the automation id as associated data.
aes-gcm = "0.10"
# base64: the secret box's envelope and webhook signatures are standard base64.
base64 = "0.22"
# hmac + sha2: Standard Webhooks signatures are HMAC-SHA256 over the raw body.
hmac = "0.12"
# subtle: signatures are compared in constant time.
subtle = "2"
# ace-json: definitions, cursors and run records are stored as JavaScript's JSON, key order and
# all, so rows written here read the same in the TypeScript daemon.
ace-json = { path = "../ace-json" }
# jiff: IANA zone rules for the civil calendar. Its bundled tzdb keeps the answer independent of
# the machine's zoneinfo; the resolution algorithm is the TypeScript's own probe.
jiff = { version = "1.0", default-features = false, features = [
  "std",
  "tzdb-bundle-always",
] }
# rustix: the webhook key file's O_NOFOLLOW/O_NONBLOCK/O_EXCL open, fstat and fchmod.
rustix = { version = "1", features = ["fs", "process"] }
# sha2: Standard Webhooks signatures and a manual run's idempotency key is the SHA-256 of its automation and event key, so a
# retried request maps to the same run even after its row was pruned.
sha2 = "0.10"
# serde: definitions are derived structs in the protocol's field order.
serde = { version = "1", features = ["derive"] }
# thiserror: one typed error enum for the crate.
thiserror = { version = "2" }

[dev-dependencies]
tempfile = "3"
