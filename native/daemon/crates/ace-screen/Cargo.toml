[package]
name = "ace-screen"
description = "The daemon's side of the screen helpers: the computer client's helper pool and wire (ADR 0225, S1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-json: helper replies read as lenient raw JSON with JavaScript semantics (ADR 0225 §1).
ace-json = { path = "../ace-json" }
# ace-supervisor: every helper process is spawned, written to and stopped supervised (E2).
ace-supervisor = { path = "../ace-supervisor" }
# serde: the reply structs keep the helper's field order, serialized by ace-json.
serde = { version = "1", features = ["derive"] }
# thiserror: one typed error enum for the crate, mapped in the binding.
thiserror = { version = "2" }
# tokio: timers for deadlines and graces, channels between the connection and its tasks.
tokio = { version = "1.54", features = ["io-util", "macros", "rt", "sync", "time"] }
# tokio-util: the cancellation token a request is stopped by.
tokio-util = "0.7.20"
