# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-daemon-node"
description = "The daemon's Rust core as one N-API addon: a thin binding over its crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# ace-adapter-opencode: the opencode translator behind ACE_TRANSLATORS (E1).
ace-adapter-opencode = { path = "../ace-adapter-opencode" }
# ace-adapter-cursor: the Cursor translator shell calls into its JSON API.
ace-adapter-cursor = { path = "../ace-adapter-cursor" }
ace-store = { path = "../ace-store" }
# ace-adapter-codex: the Codex translator behind the exported translator name (E1).
ace-adapter-codex = { path = "../ace-adapter-codex" }
# ace-core: facts cross the binding as JSON; the type names the spliced body.
ace-core = { path = "../ace-core" }
# ace-adapter-claude: the claude translator this binding drives (E1); behaviour lives there.
ace-adapter-claude = { path = "../ace-adapter-claude" }
# ace-adapter-pi: the Pi translator behind the native shell.
ace-adapter-pi = { path = "../ace-adapter-pi" }
# ace-adapter-api: frames cross the binding as redacted JSON.
ace-adapter-api = { path = "../ace-adapter-api" }
# bytes: the payload `NativeSocketHandle.send` hands the socket, and the bytes
# the socket's events carried (already in the lock through ace-transport).
bytes = { version = "1.12" }
# thiserror: one typed error enum for the crate, mapped to JS errors.
thiserror = { version = "2" }
# zeroize: an inbound message's vector is wiped after it is copied for
# JavaScript, so the bytes a client sent do not outlive the delivery.
zeroize = { version = "1" }
# ace-adapter-acp: the ACP translator behind ACE_TRANSLATORS=acp (E1); the binding only translates.
ace-adapter-acp = { path = "../ace-adapter-acp" }
# ace-git: Git behind @ace/git's interfaces behind ACE_GIT (G0 owns the foundations); the binding only translates.
ace-git = { path = "../ace-git" }
# ace-supervisor: spawning, containment and the inventory journal behind
# @ace/provider-kit's process exports (E2a); the binding only translates.
ace-supervisor = { path = "../ace-supervisor" }
# ace-transport: the loopback and remote listeners (T0 owns the skeleton); the binding only translates.
ace-transport = { path = "../ace-transport" }
# tokio: the I/O runtime for the supervisor's pumps, waiters and stop tasks.
tokio = { version = "1.54", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
# napi: the one addon; every export catches panics and only translates values and errors.
# napi9 for node_api_throw_syntax_error: a frame that is not JSON throws a SyntaxError.
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"
# ace-json: frames and facts cross N-API as JSON text with JSON.parse and JSON.stringify
# semantics; fact bodies splice as canonical Raw text, and nothing recurses, so deeply
# nested provider data needs no stack growth.
ace-json = { path = "../ace-json" }
# ace-projection: the thread fold (phase 5.1); the binding only translates JSON text.
ace-projection = { path = "../ace-projection" }
# serde: the one serde entry for the addon (core responses and supervisor spawn requests).
serde = { version = "1", features = ["derive"] }
# serde_json: the one serde_json entry for the addon; the translators no longer use it.
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }

[build-dependencies]
napi-build = "2"
