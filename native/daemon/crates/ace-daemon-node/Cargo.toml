[package]
name = "ace-daemon-node"
description = "The daemon's Rust core as one N-API addon: a thin binding over its crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ace-store = { path = "../ace-store" }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
