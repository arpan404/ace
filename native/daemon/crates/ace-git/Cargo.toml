# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-git"
description = "Git behind @ace/git's interfaces: the CLI stays the executor through ace-supervisor; gix only for the ref reads (G1) and display status (G7) the ADR names (G0 owns the foundations)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-json: every JS-visible value serializes with JSON.parse/JSON.stringify semantics, never serde_json.
ace-json = { path = "../ace-json" }
# ace-supervisor: every Git process the core starts goes through the supervisor (ADR 0223 E2): groups or jobs, bounded capture, deadlines.
ace-supervisor = { path = "../ace-supervisor" }
# thiserror: one typed error enum for the crate, mapped in the binding.
thiserror = { version = "2" }
# tokio: the I/O runtime for process pumps, timers and stop tasks (the workspace's version and features).
tokio = { version = "1.54", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
# gix: ref, branch and worktree-list reads (G1) and display-only status (G7), behind each caller's
# contract and decoder. default-features off with only the ADR's features; never
# pack-cache-lru-static: it pulls uluru (MPL-2.0), which deny.toml bans.
gix = { version = "0.91", default-features = false, features = ["revision", "status", "sha1", "sha256", "parallel", "dirwalk", "excludes", "attributes"] }
