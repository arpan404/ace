# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-git"
description = "Git behind @ace/git's interfaces: the CLI stays the executor through ace-supervisor; gix only for the ref reads (G1) and display status (G7) the ADR names (G0 owns the foundations)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-json: every JS-visible value serializes with JSON.parse/JSON.stringify semantics, never serde_json.
ace-json = { path = "../ace-json" }
# ace-redaction: the port of @ace/redaction, whose literal spans and secret keys the
# publication scan shares with every other redaction site (ADR 0224 §8a, F0).
ace-redaction = { path = "../ace-redaction" }
# yaml-rust2: the event parser the publication scan walks for credential fields, without
# resolving aliases or dropping tags (MIT OR Apache-2.0, checked by deny.toml).
yaml-rust2 = { version = "0.13", default-features = false }
# ace-supervisor: every Git process the core starts goes through the supervisor (ADR 0223 E2): groups or jobs, bounded capture, deadlines.
ace-supervisor = { path = "../ace-supervisor" }
# thiserror: one typed error enum for the crate, mapped in the binding.
thiserror = { version = "2" }
# serde: the ref results are structs in the TypeScript's field order, serialized by ace-json.
serde = { version = "1", features = ["derive"] }
# tokio: the I/O runtime for process pumps, timers and stop tasks (the workspace's version and features).
tokio = { version = "1.54", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
# libc: O_NONBLOCK when probing a root ref, so a FIFO in the Git directory can never block a worker.
libc = { version = "0.2" }
# rustix: directory-relative O_NOFOLLOW opens for guarded conflict writes (G4).
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
# unicode-normalization: NFKD before slugging a machine name, exactly as the TypeScript's
# `normalize("NFKD")` (MIT OR Apache-2.0).
unicode-normalization = { version = "0.1", default-features = false }
# regex: diagnostics, stderr redaction, and config/version matching (already in workspace lockfile).
regex = { version = "1" }
# base64: binary stdout/stderr chunks crossing the injected-spawn port bridge (already in workspace lockfile).
base64 = { version = "0.22" }
# sha2: the standalone lease journal's name is the SHA-256 of the root, as TypeScript names it.
sha2 = { version = "0.10" }
# gix: ref, branch and worktree-list reads (G1) and display-only status (G7), behind each caller's
# contract and decoder. default-features off with only the ADR's features; never
# pack-cache-lru-static: it pulls uluru (MPL-2.0), which deny.toml bans.
gix = { version = "0.91", default-features = false, features = [
  "revision",
  "status",
  "sha1",
  "sha256",
  "parallel",
  "dirwalk",
  "excludes",
  "attributes",
] }
