# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-transport"
description = "The daemon's transport in Rust: the loopback and remote listeners, the WebSocket handshake and framing (T1a.2 owns the loopback listener, the proxy hop and the connection driver)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# thiserror: one typed error enum for the crate, mapped in the binding.
thiserror = { version = "2" }
# bytes: the bytes the driver read before it handed the connection on.
bytes = { version = "1.12" }
# getrandom: the 32-byte hop secret from the OS CSPRNG, read once at the
# boundary (`HopSecret::generate`) and never anywhere else.
getrandom = { version = "0.4" }
# futures-util: the Stream/Sink traits `frame` puts the wire behind.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# http: request and response types on the hop.
http = { version = "1.5" }
# http-body-util: Full and the boxed body the proxy streams both ways.
http-body-util = { version = "0.1.5" }
# httparse: the driver's peek at a connection's first request head; hyper's own parser.
httparse = { version = "1" }
# hyper: the HTTP/1.1 server behind the listener and the client on the hop.
hyper = { version = "1.12", features = ["client", "http1", "server"] }
# hyper-util: TokioIo bridges tokio's AsyncRead/AsyncWrite to hyper's, TokioTimer drives header_read_timeout.
hyper-util = { version = "0.1.21", features = ["tokio"] }
# tokio: the I/O runtime for the listener, the connections, timers and tasks.
tokio = { version = "1.54", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
# tokio-util: CancellationToken tells connection tasks and upgrade handlers the listener is closing.
tokio-util = { version = "0.7.20" }
# tungstenite: `derive_accept_key` alone, the `Sec-WebSocket-Accept` digest the
# handshake pins to ws's. Framing is `frame`'s since T1b.3a; no TLS, no URL.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# rustls: TLS termination for the remote listeners (T1b.1a). aws-lc-rs with
# post-quantum preferred, named explicitly so a later default change cannot
# move the provider; never ring, and no rustls-pemfile (pki-types reads PEM).
rustls = { version = "0.23.46", default-features = false, features = [
  "aws_lc_rs",
  "prefer-post-quantum",
  "std",
  "tls12",
  "logging",
] }
# tokio-rustls: the TLS handshake over an accepted TcpStream, and the client
# the tests shake hands with.
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "aws_lc_rs",
  "tls12",
  "logging",
] }
# zeroize: the hop secret is wiped on drop in a way the optimizer cannot remove,
# and a TLS identity's key PEM is held only in a `Zeroizing` buffer while it is
# parsed.
zeroize = { version = "1" }

[dev-dependencies]
# tokio/test-util: the socket's close deadline is driven by tokio's clock, which a
# test advances (`start_paused`) instead of waiting 30 s.
tokio = { version = "1.54", features = ["test-util"] }
# tokio-tungstenite: the client in the socket tests, so every framing test runs
# against another implementation instead of this one's writer. No TLS, no URL.
tokio-tungstenite = { version = "0.30", default-features = false }
