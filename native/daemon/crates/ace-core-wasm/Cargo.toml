# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-core-wasm"
description = "ace-core as WebAssembly for fake-daemon in the browser: a thin wasm-bindgen binding with no logic of its own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# ace-core: the one reducer, shared with the addon.
ace-core = { path = "../ace-core" }
# wasm-bindgen: the browser binding for fake-daemon (ADR 0223, decided by the orchestrator).
wasm-bindgen = "0.2"
# js-sys: the ids callback the facade passes into each fold.
js-sys = "0.3"
# serde: the response struct derives Serialize for ace-json emits.
serde = { version = "1", features = ["derive"] }
# serde_json: states and facts still deserialize through serde (typed
# decoding bridges via canonical text); emits go through ace-json.
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
# ace-json: facts, states and emits cross the wasm boundary as
# JavaScript-exact JSON.
ace-json = { path = "../ace-json" }
