# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-provider-login"
description = "Provider sign-in as a session: one job per account, its progress, its cancellation and its cleanup, ported from `packages/accounts/src/login-sessions.ts` and the daemon's login refusal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dev-dependencies]
# serde_json: wire shapes are checked against @ace/protocol's exact JSON.
serde_json = "1"

[dependencies]
# ace-protocol: the provider kinds and account instance ids clients send.
ace-protocol = { path = "../ace-protocol" }
# futures: a driver's run is a LocalBoxFuture; sign-ins stay on the daemon's single thread.
futures = { version = "0.3" }
# serde: progress and results are wire values with @ace/protocol's field names.
serde = { version = "1", features = ["derive"] }
# tokio: a started sign-in runs as a local task, and `completed` waits for its end.
tokio = { version = "1.54", features = ["rt", "sync"] }
