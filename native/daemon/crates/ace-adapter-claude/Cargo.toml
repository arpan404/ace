# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-adapter-claude"
description = "The claude provider's translator (E1) and session (E3, except Claude) behind @ace/engine-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-adapter-api: the Adapter, Translator and Session traits this provider implements.
ace-adapter-api = { path = "../ace-adapter-api" }
# serde: typed views of provider frames decode from the redacted capture (lenient, never fatal).
serde = { version = "1", features = ["derive"] }
# ace-json: provider frames and facts as JavaScript-exact JSON (JSON.parse and
# JSON.stringify semantics, no recursion, raw splices).
ace-json = { path = "../ace-json" }
# thiserror: the translator's typed errors, mapped to diagnostics (never thrown on provider data).
thiserror = { version = "2" }
# ace-supervisor: sessions spawn the provider CLI through the supervisor, never directly.
ace-supervisor = { path = "../ace-supervisor" }
