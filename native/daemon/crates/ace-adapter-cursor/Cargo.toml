[package]
name = "ace-adapter-cursor"
description = "The cursor provider's translator (E1) and session (E3, except Claude) behind @ace/engine-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-adapter-api: the Adapter, Translator and Session traits this provider implements.
ace-adapter-api = { path = "../ace-adapter-api" }
# ace-supervisor: sessions spawn the provider CLI through the supervisor, never directly.
ace-supervisor = { path = "../ace-supervisor" }
# ace-core: translators return its facts; only the core allocates ace ids.
ace-core = { path = "../ace-core" }
# serde: the translator's options and envelope views deserialize from the shell's JSON.
serde = { version = "1", features = ["derive"] }
# serde_json: frames keep each message's encoding as JSON; facts are built as JSON values.
# `preserve_order` keeps object key order as the TypeScript's insertion order,
# so emitted fact and diagnostic JSON matches field for field.
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
# sha2: StreamedAnswer hashes the streamed text as UTF-16LE, as Node's sha256 does.
sha2 = { version = "0.11" }
# thiserror: the translator's typed budget errors, mapped to the overflow fence.
thiserror = { version = "2" }
