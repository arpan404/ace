# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-fanout"
description = "The daemon's subscriptions and fan-out in Rust (T3): the per-connection event encoder (WireEncoder, EventEncodings, short deltas, raw-on-demand), the subscriptions' snapshots, bounded replay and cursors, the sidebar window, and the command lanes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-json: every event and message is a JavaScript value, serialized byte for byte as
# `JSON.stringify` does, so the encoder's frames are identical to the TypeScript's.
ace-json = { path = "../ace-json" }
# ace-projection: `isSidebarEvent` and `changedItemId` already live there, as their TypeScript
# does in `@ace/projection`; the subscription reads them rather than copying them.
ace-projection = { path = "../ace-projection" }
