[package]
name = "ace-protocol"
description = "Rust types for the @ace/protocol values the engine reads and writes, generated from the Zod schemas, never hand-edited"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-json: the shape table's walk keeps values in JavaScript's key order, numbers and lone
# surrogates, as Zod's parse does.
ace-json = { path = "../ace-json" }
# fancy-regex: the JavaScript patterns the schemas state (lookaheads included) are checked as
# Zod checks them.
fancy-regex = "0.16"
# url: the WHATWG parser `z.url()` uses, so a string Zod refuses is refused here.
url = "2"
# serde: generated types serialize for tests and stored rows.
serde = { version = "1", features = ["derive"] }
# serde_json: generated types keep stored JSON as stored (RawValue), never re-encoded.
serde_json = { version = "1", features = ["raw_value"] }
# jiff: an IANA time zone name is checked against the same database Intl accepts.
jiff = "1"
# unicode-segmentation: a two-grapheme icon is counted as Intl.Segmenter counts it.
unicode-segmentation = "1"
