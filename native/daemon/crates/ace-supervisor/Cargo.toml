[package]
name = "ace-supervisor"
description = "Process supervision behind @ace/provider-kit's process exports: spawning, containment, inventory, stop plans, bounded framing and JSON-RPC (E2 owns the port)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-store: the inventory and escapee journal stay one SQLite library by opening through the store's connection type.
ace-store = { path = "../ace-store" }
# serde: schemas for the JSON the binding crosses; the journal rows reuse node:sqlite shapes.
serde = { version = "1", features = ["derive"] }
# serde_json: journal entries and binding payloads cross as JSON text, byte-for-byte today's.
serde_json = { version = "1", features = ["preserve_order"] }
# thiserror: one typed error enum for the crate, mapped in the binding.
thiserror = { version = "2" }
# tokio: the I/O runtime for processes, pipes, sockets, HTTP and timers (multi-thread, two workers), the one Spade already ships.
tokio = { version = "1.54", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# tokio-util: LinesCodec::new_with_max_length for bounded line framing over pipes.
tokio-util = { version = "0.7", features = ["codec"] }
# sysinfo: lists processes for the owner sweep (process-marker.ts).
sysinfo = { version = "0.40" }
# eventsource-stream: OpenCode's SSE transport.
eventsource-stream = "0.2"

[target.'cfg(unix)'.dependencies]
# rustix: the POSIX calls std does not offer (killpg, child-subreaper adoption, waitid without reaping).
rustix = { version = "1", features = ["process", "thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
# procfs: exact kernel start times from /proc, so a reused pid is never signalled (identity is pid plus start time).
procfs = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# libproc: exact kernel start times from proc_pidinfo on macOS.
libproc = "0.14"

[target.'cfg(windows)'.dependencies]
# windows-sys: Job Objects (a child joins its job while suspended), Toolhelp snapshots, GetProcessTimes and the token SID for identity, the System32 path; Spade's version.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
