# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-devices"
description = "Device discovery and pushed inventory, and the device platform behind @ace/devices' interfaces (ADR 0225, D2 and D3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-json: every JS-visible value serializes with JSON.parse/JSON.stringify semantics, never serde_json.
ace-json = { path = "../ace-json" }
# ace-mcp: M1's catalog holds the tools' prose and the public error words, so the
# sim_* descriptors and failures read the same files the server serves.
ace-mcp = { path = "../ace-mcp" }
# ace-supervisor: every child process (adb start-server, SDK commands) runs supervised.
ace-supervisor = { path = "../ace-supervisor" }
# base64: the registry's sha512 integrity strings are base64.
base64 = "0.22"
# flate2: npm tarballs are gzipped.
flate2 = "1"
# rustls + tokio-rustls: the download client's TLS, with the provider ace-transport already uses.
rustls = { version = "0.23.46", default-features = false, features = [
  "aws_lc_rs",
  "std",
  "tls12",
  "logging",
] }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "aws_lc_rs",
  "tls12",
  "logging",
] }
# rustls-native-certs: the operating system's trust store. No root bundle and no extra licence
# (reqwest's platform verifier would bring webpki-root-certs, CDLA-Permissive-2.0).
rustls-native-certs = "0.8"
# url: the download URLs, and redirect resolution against them.
url = "2"
# sha2: the registry's sha512 and scrcpy's sha256 checksums.
sha2 = "0.10"
# tar: unpacks npm tarballs and scrcpy's release archive.
tar = "0.4"
# notify: filesystem watches for the AVD folder and CoreSimulator device set (D2).
notify = { version = "8" }
# regex: the ANSI escape sequences Node's stripVTControlCharacters removes, already in the
# workspace lockfile through ace-git.
regex = "1"
# indexmap: the service's retained-lease counts keep insertion order as a JS Map does.
indexmap = { version = "2" }
# serde: the results are structs in the TypeScript's field order, serialized by ace-json.
serde = { version = "1", features = ["derive"] }
# serde_json: reads the device word catalog this crate embeds (catalog/devices.json).
serde_json = { version = "1" }
# thiserror: one typed error enum for the crate, mapped in the binding.
thiserror = { version = "2" }
# tokio: async TCP for host:track-devices-l and timers/channels for background watches.
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# tokio-util: CancellationToken for clean stop of track sockets and watchers.
tokio-util = { version = "0.7.20" }
