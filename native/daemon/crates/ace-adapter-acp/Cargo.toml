# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-adapter-acp"
description = "The acp provider's translator (E1) and session (E3, except Claude) behind @ace/engine-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# ace-adapter-api: the Adapter, Translator and Session traits this provider implements.
ace-adapter-api = { path = "../ace-adapter-api" }
# ace-supervisor: sessions spawn the provider CLI through the supervisor, never directly.
ace-supervisor = { path = "../ace-supervisor" }
# ace-core: translators return its facts; only the core allocates ace ids.
ace-core = { path = "../ace-core" }
# serde: translator state and quirks serialize for tests and diagnostics.
serde = { version = "1", features = ["derive"] }
# ace-json: provider frames and facts as JavaScript-exact JSON (JSON.parse and
# JSON.stringify semantics, no recursion, raw splices).
ace-json = { path = "../ace-json" }
# sha2: error and shell-output digests are SHA-256 hex, the same digest TypeScript records.
sha2 = { version = "0.11" }
# indexmap: translator maps and sets keep TypeScript insertion order so fact order matches.
indexmap = { version = "2" }
# thiserror: one typed error enum for the crate, mapped in the binding.
thiserror = { version = "2" }
