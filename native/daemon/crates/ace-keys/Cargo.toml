[package]
name = "ace-keys"
description = "The one fingerprint rule ace's crates compare: 64 lowercase hex characters, and the base32 host id a static key names"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# sha2: a fingerprint is the SHA-256 of a key's SubjectPublicKeyInfo or its static public half.
sha2 = { version = "0.11" }
# data-encoding: base32 for a host id, the form relay addresses and pairing links use.
data-encoding = { version = "2.6" }
