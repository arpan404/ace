# SPDX-License-Identifier: Apache-2.0
# The daemon's Rust core: the event store first (ADR 0222), later the engine,
# adapters, agent-control and machines, each a crate in this workspace.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
