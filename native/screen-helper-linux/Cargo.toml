[package]
name = "ace-screen-helper-linux"
version = "0.1.0"
edition = "2024"
# zbus 5 and zvariant (D-Bus for AT-SPI and the portals) need 1.87. Keep in step with
# tools/release/src/screen-helper-assets.ts, which checks it before a desktop or release build.
rust-version = "1.87"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
jpeg-encoder = "0.6"
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "io-util", "io-std", "net"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
atspi = { version = "0.29", default-features = false, features = ["proxies", "tokio"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# ace-media's own crates (docs/media/plan.md, E2): the MediaFrame codec and capability types,
# the codec contracts and the bitstream helpers. The encoders follow, Linux only.
media-wire = { path = "../media/crates/media-wire" }
media-codec = { path = "../media/crates/media-codec" }
media-bitstream = { path = "../media/crates/media-bitstream" }
# The ingest writer and route, shared with the Windows helper (sans-IO; this helper drives it).
media-ingest = { path = "../media/crates/media-ingest" }
zeroize = "1"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
# VA-API (Intel, AMD), NVENC (NVIDIA) and the last-resort Chrome encoder. Each opens its
# libraries at run time; nothing is linked.
media-vaapi = { path = "../media/crates/media-vaapi" }
media-nv = { path = "../media/crates/media-nv" }
media-chrome = { path = "../media/crates/media-chrome" }
libloading = "0.8"

[dev-dependencies]
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
cc = "1"

[[example]]
name = "encode"
path = "bench/encode.rs"
