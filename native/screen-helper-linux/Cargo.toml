[package]
name = "ace-screen-helper-linux"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
jpeg-encoder = "0.6"
tokio = { version = "1", features = ["rt", "time", "macros", "sync", "io-util", "io-std"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
atspi = { version = "0.29", default-features = false, features = ["proxies", "tokio"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "damage", "xtest", "render", "composite"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
cc = "1"

[[example]]
name = "encode"
path = "bench/encode.rs"
