# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-history"
description = "The daemon's saved-history reader: history-wire on stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Races, crashes and observations for the process tests; never in a release build.
test-hooks = []

[dependencies]
cap-fs-ext = "4"
cap-std = "4"
# The confined, link-refusing walk native/files reviewed; one implementation, not two.
files-safe = { path = "../../../files/crates/files-safe" }
history-text = { path = "../history-text" }
history-wire = { path = "../history-wire" }
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
sha2 = "0.10"
fs4 = "0.13"
tempfile = "3"

[dev-dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
