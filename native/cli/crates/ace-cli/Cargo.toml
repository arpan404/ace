# SPDX-License-Identifier: Apache-2.0
[package]
name = "ace-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ace"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.23"
cli-out = { path = "../cli-out" }
cli-parse = { path = "../cli-parse" }
cli-table = { path = "../cli-table" }
cli-wire = { path = "../cli-wire" }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
url = { version = "2", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["alloc", "std", "clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "preserve_order"] }
uuid = { version = "1.0", default-features = false, features = ["v4"] }
ctrlc = "3.4"
