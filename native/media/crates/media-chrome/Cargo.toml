# SPDX-License-Identifier: Apache-2.0

[package]
name = "media-chrome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
media-codec = { path = "../media-codec" }
media-wire = { path = "../media-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
command-fds = "0.3"
nix = { version = "0.31", default-features = false, features = ["signal", "process", "user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[[example]]
name = "encode"
path = "bench/encode.rs"
