# SPDX-License-Identifier: Apache-2.0

[package]
name = "media-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
num_cpus = "1"
libjpeg-turbo-rs = { version = "=0.9.0", default-features = false, features = ["std", "simd"] }
jpeg-decoder = { version = "0.3", default-features = false }
zune-jpeg = "0.5"
zune-core = "0.5"
fast_image_resize = { version = "5", default-features = false }

[[example]]
name = "still"
path = "bench/still.rs"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGContext", "CGImage", "CGDataProvider", "CGColorSpace"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "objc2-core-graphics"] }

[[example]]
name = "alloc"
path = "bench/alloc.rs"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
