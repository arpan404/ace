[package]
name = "media-image"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
media-codec = { path = "../media-codec" }
media-wire = { path = "../media-wire" }
zune-jpeg = "0.5"
zune-core = "0.5"
png = "0.18"
image-webp = "0.2"
gif = { version = "0.14", default-features = false, features = ["std"] }
resvg = { version = "0.50", default-features = false }
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw", "jpeg"] }
zune-bmp = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFData",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGBitmapContext",
  "CGContext",
  "CGImage",
  "CGColorSpace",
] }
objc2-image-io = { version = "0.3", default-features = false, features = [
  "std",
  "CGImageSource",
  "CGImageProperties",
  "objc2-core-graphics",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "image"
path = "bench/image.rs"
