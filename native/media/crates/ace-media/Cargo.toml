# SPDX-License-Identifier: Apache-2.0

[package]
name = "ace-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
media-bitstream = { path = "../media-bitstream" }
media-chrome = { path = "../media-chrome" }
media-codec = { path = "../media-codec" }
media-core = { path = "../media-core" }
media-mp4 = { path = "../media-mp4" }
media-noise = { path = "../media-noise" }
media-wire = { path = "../media-wire" }
serde_json = "1"
subtle = { version = "2.6", default-features = false }
zeroize = "1.9"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.47", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "io-std",
  "sync",
  "time",
  "macros",
] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# The relay stream client uses its upgrade-key helpers only (shell/relay_ws.rs).
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
# wss:// relays (shell/relay_tls.rs): rustls on ring (no aws-lc), verified against the OS trust
# store (rustls-native-certs; rustls-platform-verifier pulls a CDLA crate for wasm32). The
# unbuffered API lets TLS records be written into one buffer sized once.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
media-vt = { path = "../media-vt" }

[dev-dependencies]

[[example]]
name = "ingest"
path = "bench/ingest.rs"

[[example]]
name = "still"
path = "bench/still.rs"
