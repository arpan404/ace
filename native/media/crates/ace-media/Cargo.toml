[package]
name = "ace-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
media-codec = { path = "../media-codec" }
media-core = { path = "../media-core" }
media-noise = { path = "../media-noise" }
media-wire = { path = "../media-wire" }
serde_json = "1"
subtle = { version = "2.6", default-features = false }
zeroize = "1.9"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
