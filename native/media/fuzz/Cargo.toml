# SPDX-License-Identifier: Apache-2.0
# Fuzzing lives outside the media workspace: `cargo fuzz run transcode` from
# native/media/fuzz (nightly). Normal workspace builds and cargo deny never see it.

[package]
name = "media-codec-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
media-codec = { path = "../crates/media-codec" }
libjpeg-turbo-rs = { version = "=0.9.0", default-features = false, features = ["std", "simd"] }
zune-jpeg = "0.5"
zune-core = "0.5"

[[bin]]
name = "transcode"
path = "fuzz_targets/transcode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seed_corpus"
path = "src/seed_corpus.rs"
test = false
doc = false
bench = false
