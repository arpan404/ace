# SPDX-License-Identifier: Apache-2.0

[package]
name = "files-safe"
description = "Confines relative paths to a checkout root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cap-fs-ext = "4"
cap-std = "4"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
same-file = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
winx = "0.36"

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
