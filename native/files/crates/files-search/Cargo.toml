[package]
name = "files-search"
description = "Content search over a checkout with ripgrep's libraries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
files-safe = { path = "../files-safe" }
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
libc = "0.2"
regex = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "search"
harness = false
