<!doctype html>
<html
  lang="en"
  data-theme="ace"
  data-scheme="dark"
  data-surface="translucent"
  data-density="comfortable"
  data-corners="default"
>
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the layout (h-dvh) shrinks with the on-screen keyboard on Chrome/Android. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <title>ace</title>
    <style>
      /*
       * First visit only (no theme to replay): ace in the OS scheme until the theme stylesheet
       * loads, so a light OS never sees a dark first frame. The script below sets data-first-visit.
       */
      html {
        background: #0d0d0d;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        html[data-first-visit] {
          background: #ffffff;
          color-scheme: light;
        }
        html[data-first-visit] #boot {
          --background: #ffffff;
          --foreground: #111111;
        }
      }
      /*
       * The first paint, before the app's script runs: the ace mark centred on the theme's
       * background, in the theme replayed below (ace in the OS scheme on a first visit). The
       * startup screen (src/features/startup) draws the same thing at the same place and removes
       * this unseen, then cross-fades to the app once it has its first data. Never a skeleton.
       */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 140;
        pointer-events: none;
        background: var(--background, #0d0d0d);
        transition: opacity var(--motion-base, 200ms) var(--ease-out, ease);
      }
      #boot[data-leaving] {
        opacity: 0;
      }
      /* The window has no title bar; this strip moves it, as the startup screen's does. */
      #boot .drag {
        position: fixed;
        inset: 0 0 auto;
        height: 50px;
        pointer-events: auto;
        -webkit-app-region: drag;
      }
      /* 44px, rounded like the app icon: the glyph in the page colour on the text colour. */
      #boot .mark {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 44px;
        height: 44px;
        transform: translate(-50%, -50%);
        border-radius: 30%;
        background: var(--foreground, #f0f0f0);
        color: var(--background, #0d0d0d);
        /* A slow breath while ace starts, under reduced motion too (opacity only; fx-breathe in
           styles/motion.css carries it on). */
        animation: boot-breathe 1.6s ease-in-out infinite alternate;
      }
      @keyframes boot-breathe {
        to {
          opacity: 0.55;
        }
      }
      /* Shown under the mark when the boot itself fails or nothing replaces this in 15s. */
      #boot .stuck {
        position: absolute;
        inset: calc(50% + 44px) 0 auto;
        margin: 0;
        padding: 0 24px;
        text-align: center;
        font:
          13px/1.45 system-ui,
          sans-serif;
        color: color-mix(in oklab, var(--foreground, #f0f0f0) 70%, transparent);
      }
      #boot .stuck button {
        pointer-events: auto;
        font: inherit;
        color: var(--foreground, #f0f0f0);
        background: none;
        border: 0;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
    </style>
    <script>
      // The desktop app's preload bridge says which platform draws the window chrome.
      try {
        const platform = window.ace && window.ace.platform;
        if (typeof platform === "string")
          document.documentElement.setAttribute("data-platform", platform);
      } catch {}
      // Replay the appearance the app last applied (src/theme/theme-provider.tsx) before first
      // paint. Resolving "system" against the OS mirrors resolveAppearance (src/theme/appearance.ts).
      {
        const root = document.documentElement;
        const prefers = (query) => matchMedia("(" + query + ")").matches;
        let boot = null;
        try {
          boot = JSON.parse(localStorage.getItem("ace.boot-appearance") || "null");
        } catch {}
        if (boot && typeof boot.css === "string") {
          const sheet = document.createElement("style");
          sheet.id = "ace-themes";
          sheet.textContent = boot.css;
          document.head.append(sheet);
          root.setAttribute("data-theme", String(boot.theme));
          if (boot.density) root.setAttribute("data-density", String(boot.density));
          if (boot.corners) root.setAttribute("data-corners", String(boot.corners));
          if (typeof boot.transcriptPx === "number")
            root.style.setProperty("--transcript-size", boot.transcriptPx + "px");
          root.style.background = "var(--background)";
        } else {
          // Nothing to replay (a first visit, or storage denied): ace following the OS, as the
          // defaults will once the app loads.
          boot = {};
          root.setAttribute("data-first-visit", "");
        }
        const mode = boot.mode === "light" || boot.mode === "dark" ? boot.mode : "system";
        root.setAttribute(
          "data-scheme",
          mode === "system" ? (prefers("prefers-color-scheme: dark") ? "dark" : "light") : mode,
        );
        root.setAttribute(
          "data-surface",
          boot.surface === "solid" || prefers("prefers-reduced-transparency: reduce")
            ? "solid"
            : "translucent",
        );
        if (
          boot.reduceMotion === "on" ||
          (boot.reduceMotion !== "off" && prefers("prefers-reduced-motion: reduce"))
        )
          root.setAttribute("data-reduce-motion", "");
      }
      // A boot that fails outright (an entry script that can't load or throws while loading)
      // says so on the splash at once; the app replaces the splash when it gets going.
      const bootError = (message) => {
        const boot = document.getElementById("boot");
        if (!boot || boot.hasAttribute("data-leaving") || boot.querySelector(".stuck")) return;
        const note = document.createElement("p");
        note.className = "stuck";
        note.setAttribute("role", "alert");
        note.append(`ace couldn't start: ${message} `);
        const reload = document.createElement("button");
        reload.type = "button";
        reload.textContent = "Reload";
        reload.addEventListener("click", () => location.reload());
        note.append(reload);
        boot.removeAttribute("aria-hidden");
        boot.append(note);
      };
      addEventListener(
        "error",
        (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement) bootError("its code didn't load.");
          else if (event.message && !document.getElementById("root")?.hasChildNodes())
            bootError(event.message);
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="drag"></div>
      <svg class="mark" viewBox="0 0 20 20">
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M9.3 4.6a5.1 5.1 0 1 1 0 10.2a5.1 5.1 0 1 1 0 -10.2ZM9.3 6.4a3.3 3.3 0 1 0 0 6.6a3.3 3.3 0 1 0 0 -6.6Z"
        />
        <path fill="currentColor" d="M12.7 14.8V5.5a0.9 0.9 0 0 1 1.8 0V14.8Z" />
      </svg>
    </div>
    <div id="root"></div>
    <script>
      // A boot that never gets as far as replacing the first paint (a script that failed to load,
      // a hang) says so after 15s instead of waiting forever. The startup screen replaces it as
      // soon as the app's script runs, and handles a slow start itself.
      setTimeout(() => {
        const boot = document.getElementById("boot");
        if (!boot || boot.hasAttribute("data-leaving") || boot.querySelector(".stuck")) return;
        const note = document.createElement("p");
        note.className = "stuck";
        note.setAttribute("role", "status");
        note.append("Still starting… ");
        const reload = document.createElement("button");
        reload.type = "button";
        reload.textContent = "Reload";
        reload.addEventListener("click", () => location.reload());
        note.append(reload);
        boot.removeAttribute("aria-hidden");
        boot.append(note);
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
