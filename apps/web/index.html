<!doctype html>
<html lang="en" data-theme="dark" data-scheme="dark" data-accent="blue" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: the layout (h-dvh) shrinks with the on-screen keyboard on Chrome/Android. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <title>ace</title>
    <style>
      /*
       * First visit only (no theme to replay): the OS scheme until the theme stylesheet loads,
       * so a light OS never sees a dark first frame. The script below sets data-first-visit.
       */
      html {
        background: #0a0a0a;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        html[data-first-visit] {
          background: #f6f6f7;
          color-scheme: light;
        }
        html[data-first-visit] #boot {
          --wall: #f6f6f7;
          --foreground: #1d1d20;
          --sidebar-rgb: 242 242 245;
          --reading-rgb: 250 250 251;
          --sidebar-border: rgb(0 0 0 / 0.07);
        }
      }
      /*
       * The boot shell: sidebar rows and header painted before the app's script runs,
       * in the theme replayed below (Dark defaults on a first visit). The app fades it out over
       * --dur-2 once the real shell has painted (src/lib/boot-splash.ts).
       */
      /* Tailwind's preflight isn't loaded yet: size like the real shell, borders and padding in. */
      #boot,
      #boot * {
        box-sizing: border-box;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 140;
        display: flex;
        pointer-events: none;
        background: var(--wall, #0a0a0a);
        transition: opacity var(--dur-2, 200ms) var(--ease, ease);
      }
      #boot[data-leaving] {
        opacity: 0;
      }
      #boot i {
        display: block;
        flex: none;
        border-radius: 6px;
        background: color-mix(in oklab, var(--foreground, #ededed) 6%, transparent);
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      /* Mirrors the shell: sidebar 280px, header 50px (src/features/shell). */
      #boot .side {
        width: 280px;
        flex: none;
        display: flex;
        flex-direction: column;
        background: rgb(var(--sidebar-rgb, 19 19 21) / 0.92);
        border-right: 1px solid var(--sidebar-border, rgb(255 255 255 / 0.06));
      }
      #boot .top {
        height: 50px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 10px;
      }
      #boot .top .name {
        width: 40px;
        height: 14px;
        margin-right: auto;
      }
      #boot .top .quick {
        width: 28px;
        height: 28px;
        border-radius: 10px;
      }
      #boot .nav-rows {
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 6px 18px 14px;
      }
      #boot .nav-rows i {
        width: 46%;
        height: 14px;
      }
      #boot .rows {
        display: flex;
        flex-direction: column;
        gap: 21px;
        padding: 10px 18px;
      }
      #boot .rows i {
        height: 10px;
      }
      #boot .foot {
        margin-top: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
      }
      #boot .foot .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
      }
      #boot .foot .who {
        width: 90px;
        height: 12px;
        margin-right: auto;
      }
      #boot .foot .gear {
        width: 20px;
        height: 20px;
      }
      #boot .main {
        flex: 1;
        min-width: 0;
        background: rgb(var(--reading-rgb, 14 14 15));
      }
      #boot .head {
        height: 50px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 12px;
      }
      #boot .head .nav {
        width: 30px;
        height: 30px;
        border-radius: 10px;
      }
      #boot .head .title {
        width: 220px;
        height: 12px;
        margin-left: 14px;
      }
      /* Shown by the watchdog below when nothing has replaced the splash in 15s. */
      #boot .stuck {
        padding: 0 24px;
        font:
          13px/1.45 system-ui,
          sans-serif;
        color: color-mix(in oklab, var(--foreground, #ededed) 70%, transparent);
      }
      #boot .stuck button {
        pointer-events: auto;
        font: inherit;
        color: var(--foreground, #ededed);
        background: none;
        border: 0;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      /* The desktop's macOS traffic lights sit over the start of the sidebar's first row. */
      :root[data-platform="darwin"]:not([data-fullscreen]) #boot .top {
        padding-left: 80px;
      }
      @media (max-width: 47.99rem) {
        #boot .side {
          display: none;
        }
      }
      @keyframes boot-breathe {
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        #boot i {
          transition: none;
          animation: none;
        }
      }
    </style>
    <script>
      // The desktop app's preload bridge says which platform draws the window chrome.
      try {
        const platform = window.ace && window.ace.platform;
        if (typeof platform === "string")
          document.documentElement.setAttribute("data-platform", platform);
      } catch {}
      // Replay the theme the app last applied (src/theme/theme-provider.tsx) before first paint.
      let replayed = false;
      try {
        const boot = JSON.parse(localStorage.getItem("ace.boot-theme") || "null");
        if (boot && typeof boot.css === "string") {
          replayed = true;
          const root = document.documentElement;
          const sheet = document.createElement("style");
          sheet.id = "ace-themes";
          sheet.textContent = boot.css;
          document.head.append(sheet);
          for (const [name, value] of Object.entries(boot.attributes || {}))
            root.setAttribute(name, String(value));
          for (const [name, value] of Object.entries(boot.style || {}))
            root.style.setProperty(name, String(value));
          if (boot.system) {
            const dark = matchMedia("(prefers-color-scheme: dark)").matches;
            root.setAttribute("data-theme", dark ? "dark" : "light");
            root.setAttribute("data-scheme", dark ? "dark" : "light");
          }
          root.style.background = "var(--wall)";
        }
      } catch {}
      // Nothing to replay (a first visit, or storage denied): follow the OS, as the default
      // "system" theme will once the app loads.
      if (!replayed) {
        const root = document.documentElement;
        const scheme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        root.setAttribute("data-first-visit", "");
        root.setAttribute("data-theme", scheme);
        root.setAttribute("data-scheme", scheme);
      }
      // A boot that fails outright (an entry script that can't load or throws while loading)
      // says so on the splash at once; the app replaces the splash when it gets going.
      const bootError = (message) => {
        const boot = document.getElementById("boot");
        if (!boot || boot.hasAttribute("data-leaving") || boot.querySelector(".stuck")) return;
        const note = document.createElement("p");
        note.className = "stuck";
        note.setAttribute("role", "alert");
        note.append(`ace couldn't start: ${message} `);
        const reload = document.createElement("button");
        reload.type = "button";
        reload.textContent = "Reload";
        reload.addEventListener("click", () => location.reload());
        note.append(reload);
        boot.removeAttribute("aria-hidden");
        boot.querySelector(".main")?.append(note);
      };
      addEventListener(
        "error",
        (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement) bootError("its code didn't load.");
          else if (event.message && !document.getElementById("root")?.hasChildNodes())
            bootError(event.message);
        },
        true,
      );
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="side">
        <div class="top"><i class="name"></i><i class="quick"></i><i class="quick"></i></div>
        <div class="nav-rows"><i></i><i></i><i></i><i></i></div>
        <div class="rows">
          <i style="width: 52%"></i><i style="width: 86%"></i><i style="width: 44%"></i
          ><i style="width: 70%"></i><i style="width: 34%"></i><i style="width: 62%"></i
          ><i style="width: 80%"></i>
        </div>
        <div class="foot"><i class="avatar"></i><i class="who"></i><i class="gear"></i></div>
      </div>
      <div class="main">
        <div class="head">
          <i class="nav"></i><i class="nav"></i><i class="nav"></i><i class="title"></i>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // A boot that never gets as far as replacing the splash (a script that failed to load, a
      // hang) says so after 15s instead of breathing forever. A screen that holds the splash on
      // purpose (the desktop's "Starting ace…") marks it data-held and handles the wait itself.
      setTimeout(() => {
        const boot = document.getElementById("boot");
        if (
          !boot ||
          boot.hasAttribute("data-leaving") ||
          boot.hasAttribute("data-held") ||
          boot.querySelector(".stuck")
        )
          return;
        const note = document.createElement("p");
        note.className = "stuck";
        note.setAttribute("role", "status");
        note.append("Still starting… ");
        const reload = document.createElement("button");
        reload.type = "button";
        reload.textContent = "Reload";
        reload.addEventListener("click", () => location.reload());
        note.append(reload);
        boot.removeAttribute("aria-hidden");
        boot.querySelector(".main")?.append(note);
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
