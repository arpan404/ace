<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    The web favicon: the app icon (apps/desktop/build/icon.svg) without its margin and shadow,
    so the tile fills the tab's icon slot. The ace mark (apps/web/src/components/ace-mark.tsx)
    on its 24-unit grid spans about 77% of the tile, as it does on the app icon.
  -->
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2d31"/>
      <stop offset="0.45" stop-color="#17171a"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="2" x2="0" y2="19.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#cfd0d5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22.5" fill="url(#fill)"/>
  <g fill="url(#ink)" transform="translate(4.4 8.58) scale(3.8)">
    <path id="wing" d="M11.6 2C10.8 2 10.4 2.6 9.8 3.3L2.9 11.3C1.2 13.3 1.8 15.6 3.8 16.8L7.8 19.3C8.5 19.8 9.3 19.8 9.9 19.1L11 17.7C11.7 16.8 11.5 16.1 10.8 15.4L7.3 12.3C10.3 9.8 11.6 7.6 11.6 5V2Z"/>
    <use href="#wing" transform="translate(24 0) scale(-1 1)"/>
  </g>
</svg>
