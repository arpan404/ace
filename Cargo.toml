[workspace]
resolver = "3"
members = [
  "apps/backend",
  "apps/desktop",
  "crates/checkpoint",
  "crates/codex",
  "crates/core",
  "crates/git",
  "crates/lsp",
  "crates/persistence",
  "crates/process",
  "crates/provider_commands",
  "crates/project",
  "crates/protocol",
  "crates/runtime",
  "crates/server",
  "crates/terminal",
  "crates/workspace",
  "crates/fs",
  "crates/error",
  "crates/logger",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/arpan404/ace"
rust-version = "1.91"

[workspace.dependencies]
ace-core = { path = "crates/core" }
ace-checkpoint = { path = "crates/checkpoint" }
ace-codex = { path = "crates/codex" }
ace-git = { path = "crates/git" }
ace-lsp = { path = "crates/lsp" }
ace-persistence = { path = "crates/persistence" }
ace-process = { path = "crates/process" }
ace-provider-commands = { path = "crates/provider_commands" }
ace-project = { path = "crates/project" }
ace-protocol = { path = "crates/protocol" }
ace-runtime = { path = "crates/runtime" }
ace-server = { path = "crates/server" }
ace-terminal = { path = "crates/terminal" }
ace-workspace = { path = "crates/workspace" }
ace-error = { path = "crates/error" }
ace-fs = { path = "crates/fs" }
ace-logger = { path = "crates/logger" }

axum = { version = "0.8.9", features = ["ws"] }
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
criterion = "0.8.2"
futures-util = "0.3.32"
gpui = "=0.2.2"
gpui-component = "0.5.1"
insta = { version = "1.48.0", features = ["json"] }
portable-pty = "0.9.0"
proptest = "1.11.0"
reqwest = { version = "0.12.27", default-features = false, features = ["rustls-tls"] }
notify = "8.2.0"
ropey = "1.6.1"
rusqlite = "=0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.3", features = ["serde", "v4", "v7"] }
which = "8.0.4"
lsp-types = "0.97.0"
