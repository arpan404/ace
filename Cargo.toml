[workspace]
resolver = "3"
members = [
  "apps/desktop",
  "crates/ace-core",
  "crates/ace-persistence",
  "crates/ace-platform",
  "crates/ace-protocol",
  "crates/ace-runtime",
  "crates/ace-server",
  "crates/ace-ui",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/arpan404/ace"
rust-version = "1.91"

[workspace.dependencies]
ace-core = { path = "crates/ace-core" }
ace-persistence = { path = "crates/ace-persistence" }
ace-platform = { path = "crates/ace-platform" }
ace-protocol = { path = "crates/ace-protocol" }
ace-runtime = { path = "crates/ace-runtime" }
ace-server = { path = "crates/ace-server" }
ace-ui = { path = "crates/ace-ui" }

axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive", "env"] }
criterion = "0.8.2"
directories = "6.0.0"
gpui = "=0.2.2"
insta = { version = "1.48.0", features = ["json"] }
proptest = "1.11.0"
rusqlite = "=0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.3", features = ["serde", "v4", "v7"] }
