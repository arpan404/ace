# ace's in-process Rust (ADR 0125). Pure logic crates (`ace-*`) forbid unsafe code and know
# nothing about JavaScript; `ace-node` is the one Node-API add-on that exposes them to the
# daemon. Spade (`spade/`) and the screen helpers (`native/`) are separate workspaces.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ace-lines = { path = "crates/ace-lines" }
memchr = "2.8.3"
napi = { version = "3.16.2", default-features = false, features = ["napi8"] }
napi-derive = "3.7.1"
napi-build = "2.6.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
# `deny`, not `forbid`, only because napi's macros allow unsafe in the code they generate for
# `ace-node`. Every other crate starts with `#![forbid(unsafe_code)]`, and `check:rust` fails
# a crate that doesn't and any hand-written `unsafe` in `ace-node`.
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
single_use_lifetimes = "deny"
unit_bindings = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
redundant_lifetimes = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Restriction lints picked for an add-on that runs inside the daemon: a panic, an unchecked
# index or a lossy cast is a daemon bug, so each one has to be spelled out.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
exit = "deny"
mem_forget = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
ptr_as_ptr = "deny"
fn_to_numeric_cast_any = "deny"
lossy_float_literal = "deny"
float_cmp_const = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mutex_atomic = "deny"
large_stack_arrays = "deny"
large_include_file = "deny"
verbose_file_reads = "deny"
rest_pat_in_fully_bound_structs = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
infinite_loop = "deny"
str_to_string = "deny"
needless_raw_strings = "deny"
redundant_type_annotations = "deny"
missing_assert_message = "deny"
# Performance: no hidden copies or allocations on hot paths.
inefficient_to_string = "deny"
format_push_string = "deny"
large_types_passed_by_value = "deny"
needless_collect = "deny"
redundant_clone = "deny"
trivially_copy_pass_by_ref = "deny"
# Pedantic lints that fight the code more than they help.
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Release builds are what the daemon runs and what the perf gate measures. Overflow checks
# stay on: a wrapped length is a memory-safety question at the boundary, and the cost is
# measured. Panics unwind so napi turns one into a JavaScript error instead of killing the
# daemon; the lints above keep panics out of the code in the first place.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
overflow-checks = true
debug = false
# rustc strips through its bundled rust-objcopy, which on macOS can't find the libLLVM it
# links against in rustup's 1.99 toolchains. `packages/native/build.ts` strips local symbols
# with the platform's own `strip` instead.
strip = false
incremental = false

[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = "none"
