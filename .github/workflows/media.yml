# SPDX-License-Identifier: Apache-2.0
name: Media

on:
  pull_request:
    paths:
      - "native/media/**"
      - "scripts/check-media.ts"
      - "package.json"
      - ".github/workflows/media.yml"
  push:
    branches: [main]
    paths:
      - "native/media/**"
      - "scripts/check-media.ts"
      - "package.json"
      - ".github/workflows/media.yml"

permissions:
  contents: read

jobs:
  media:
    name: Media (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - name: Install cargo-deny
        run: cargo +1.95.0 install cargo-deny --version 0.20.2 --locked
      - name: Check media workspace
        run: bun run check:media
