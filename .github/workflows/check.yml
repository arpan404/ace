name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read required Node major
        id: node
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { engines } = JSON.parse(readFileSync('package.json', 'utf8'));
          const major = engines.node.match(/\d+/)[0];
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${major}.x\n`);
          NODE

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          package-manager-cache: false

      - name: Install Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache Bun installs
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Generated protocol reference
        run: bun run docs:protocol --check

      - name: Lint
        run: bun run lint

      - name: File size limit
        run: bun run check:size

      - name: UI value conventions
        run: bun run check:ui

      - name: Browser module boundaries
        run: bun run check:deps

      - name: Typecheck
        run: bun run typecheck

      - name: Install ripgrep for workspace search contract tests
        shell: bash
        run: |
          if ! command -v rg >/dev/null; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update
              sudo apt-get install -y ripgrep
            else
              brew install ripgrep
            fi
          fi

      - name: Install Linux screen build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev dbus

      - name: Build native screen interoperability fixtures
        run: |
          cargo build --locked -j 2 --manifest-path native/screen-helper-windows/Cargo.toml --example wire_fixture
          cargo build --locked -j 2 --manifest-path native/screen-helper-linux/Cargo.toml --example wire_fixture

      - name: Native screen behavior tests
        run: |
          cargo test --locked -j 2 --manifest-path native/screen-helper-windows/Cargo.toml
          cargo test --locked -j 2 --manifest-path native/screen-helper-linux/Cargo.toml

      - name: macOS screen behavior tests
        if: runner.os == 'macOS'
        run: |
          swift build --package-path native/screen-helper --target ScreenTest
          swift test --package-path native/screen-helper

      - name: X11 pointer refusal with real grabs and applications
        if: runner.os == 'Linux'
        run: native/screen-helper-linux/test-in-docker.sh --pointer

      - name: Tests
        # Chromium keeps its sandbox; only this disposable runner enables userns.
        # Set up before tests because runner images can include Chromium already.
        run: node packages/browser/ci/sandbox.ts && bun run test

      - name: Web performance budgets (bundle per route, month-long soak)
        run: bun run --filter @ace/web-perf check:static

      - name: Daemon performance budgets
        run: node apps/daemon/bench/check.ts

      - name: Device performance budgets (when a supported simulator is available)
        if: runner.os == 'macOS'
        run: node tools/web-perf/device/check.ts

      - name: PTY throughput (informational)
        continue-on-error: true
        run: bun run --filter @ace/terminal bench 100

      - name: Build relay image and verify encrypted traffic on Node 24
        if: runner.os == 'Linux'
        run: |
          docker build -f apps/relay/Dockerfile -t ace-relay:test .
          node apps/relay/bench/docker-smoke.ts

  browser:
    name: Real Chromium browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Chromium and system libraries
        run: bun run --cwd packages/browser playwright-core install --with-deps chromium
      - name: Install fake web suite Chromium
        # System libraries are already installed above; Playwright shares its browser cache.
        run: bun run --cwd tools/web-e2e playwright install chromium
      - name: Fake web interaction regressions
        timeout-minutes: 15
        # One Vite server, two workers, in-page fixtures, no daemon or provider CLI.
        run: bun run --filter @ace/web-e2e e2e:fake
      - name: Upload fake web failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fake-web-failures
          path: tools/web-e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser tests
        run: node packages/browser/ci/sandbox.ts && bun run test -- packages/browser apps/daemon/src/browser.process.test.ts apps/daemon/src/browser-remote.process.test.ts
      - name: Web main-thread budgets (5,000 events/s, input latency, long tasks)
        run: cd tools/web-perf && bunx playwright install --with-deps chromium && bun run browser
      - name: Web memory budgets (flat heaps while streaming, a 1M-item thread, DOM size)
        run: cd tools/web-perf && bun run memory
      - name: Web long-thread budgets (paging, turn jumps, search and live tail)
        run: cd tools/web-perf && bun run long-thread
      - name: Web markdown streaming budgets (a 40 KB answer, worker time per update, remounts)
        run: cd tools/web-perf && bun run markdown-stream
