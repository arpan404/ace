name: Issue Labels

on:
  push:
    branches:
      - main
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-labels.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync issue labels
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure managed issue labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const managedLabels = [
              {
                name: "bug",
                color: "d73a4a",
                description: "Something is broken or behaving incorrectly.",
              },
              {
                name: "enhancement",
                color: "a2eeef",
                description: "Requested improvement or new capability.",
              },
              {
                name: "needs-triage",
                color: "fbca04",
                description: "Issue needs maintainer review and initial categorization.",
              },
              {
                name: "area:web",
                color: "54aeff",
                description: "React/Vite web app, client state, and browser UX.",
              },
              {
                name: "area:server",
                color: "0969da",
                description: "Node server, daemon, WebSocket API, and CLI runtime.",
              },
              {
                name: "area:desktop",
                color: "8250df",
                description: "Electron shell, native desktop behavior, and updater flows.",
              },
              {
                name: "area:mobile",
                color: "bf3989",
                description: "React Native / Expo mobile app.",
              },
              {
                name: "area:relay",
                color: "0a7f70",
                description: "Remote relay, pairing, routing, and encrypted transport.",
              },
              {
                name: "area:providers",
                color: "fb8c00",
                description: "Provider CLI integrations and runtime adapters.",
              },
              {
                name: "area:release",
                color: "6f42c1",
                description: "Build, packaging, signing, publishing, and updater metadata.",
              },
              {
                name: "area:docs",
                color: "0075ca",
                description: "Documentation, templates, and examples.",
              },
              {
                name: "reliability",
                color: "0e8a16",
                description: "Correctness under restarts, reconnects, load, or partial failure.",
              },
              {
                name: "cross-platform",
                color: "5319e7",
                description: "macOS, Windows, or Linux compatibility.",
              },
              {
                name: "security",
                color: "b60205",
                description: "Security-sensitive behavior or dependency vulnerability work.",
              },
            ];

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (
                  existing.color !== label.color ||
                  (existing.description ?? "") !== label.description
                ) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }
