name: Release

# ace's release pipeline (ADR 0188). The owner pushes a tag and this does the rest, on ace's own
# runners: omarchy (Linux) runs every step but two; the owner's Mac only builds, signs and
# notarizes macOS; a Windows VM builds Windows. A run is resumable: every step first checks what
# the tag's release already holds, so rerunning the failed jobs (or dispatching the same tag)
# continues where it stopped. Runner setup: docs/release/runners.md.
#
# Only a tag starts it. Self-hosted runners never see pull requests: this repo is public, and a
# fork's code must never run on them. A manual run only reruns a tag that already exists.
on:
  push:
    tags:
      - "v*"
      - "ace-*-beta-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rerun (vX.Y.Z or ace-X.Y.Z-beta-N)
        required: true

permissions: {}

# One release at a time, never cancelled halfway (a deploy or a publish could be in flight).
concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NODE_VERSION: 26.12.1
  BUN_VERSION: 1.4.4

jobs:
  gate:
    name: Check who started it and which tag
    # Runs no repository code: only the shell below, so nothing from the tag runs before the
    # actor, the tag's name and its commit's place on main are checked. For a manual run this
    # file is main's copy (the ref check below refuses any other); for a tag push it is the
    # tag's, which only the owner can create (tag ruleset, ADR 0188).
    runs-on: [self-hosted, linux, omarchy]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          # The owner started it, and the owner reran it (a rerun keeps the first actor).
          [ "$ACTOR" = "$OWNER" ] || fail "Only $OWNER starts a release, not $ACTOR"
          [ "$TRIGGERING_ACTOR" = "$OWNER" ] || fail "Only $OWNER reruns a release, not $TRIGGERING_ACTOR"
          case "$EVENT" in
            push) [ "$REF" = "refs/tags/$TAG" ] || fail "Pushed ref $REF is not tag $TAG" ;;
            workflow_dispatch) [ "$REF" = refs/heads/main ] || fail "Run it from main, not $REF" ;;
            *) fail "A release starts only from a tag push or a manual rerun, not $EVENT" ;;
          esac
          n='(0|[1-9][0-9]{0,8})'
          printf '%s\n' "$TAG" | grep -Eqx "v$n\.$n\.$n|ace-$n\.$n\.$n-beta-[1-9][0-9]{0,5}" ||
            fail "$TAG is neither vX.Y.Z nor ace-X.Y.Z-beta-N"
          sha=$(gh api "repos/$REPO/commits/refs/tags/$TAG" --jq .sha)
          [ "$EVENT" != push ] || [ "$sha" = "$GITHUB_SHA" ] || fail "$TAG moved since it was pushed"
          # main is ahead of (or at) the tag's commit: the commit is on main.
          status=$(gh api "repos/$REPO/compare/$sha...main" --jq .status)
          case "$status" in
            ahead | identical) ;;
            *) fail "$TAG points at ${sha%"${sha#????????????}"}, which isn't on main ($status)" ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  prepare:
    name: Check the tag and plan the run
    needs: gate
    runs-on: [self-hosted, linux, omarchy]
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      version: ${{ steps.plan.outputs.version }}
      title: ${{ steps.plan.outputs.title }}
      published: ${{ steps.plan.outputs.published }}
      build-mac: ${{ steps.plan.outputs.build-darwin-arm64 }}
      build-windows: ${{ steps.plan.outputs.build-win32-x64 }}
      linux-arches: ${{ steps.plan.outputs.linux-arches }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.sha }}
        run: node apps/desktop/scripts/pipeline/prepare.ts "$TAG"

  build-mac:
    name: Build, sign and notarize macOS
    needs: [gate, prepare]
    if: needs.prepare.outputs.build-mac == 'true'
    # The owner's Mac: if it is asleep, this job waits for it.
    runs-on: [self-hosted, macOS, ace-mac]
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CSC_NAME: ${{ vars.CSC_NAME }}
      APPLE_KEYCHAIN_PROFILE: ${{ vars.APPLE_KEYCHAIN_PROFILE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --os=darwin --cpu='*'
      - name: Release keys and the signing keychain
        env:
          PUBLIC_KEY: ${{ vars.ACE_RELEASE_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.ACE_RELEASE_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/keys/public.pem"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/private.pem"
          echo "ACE_RELEASE_PUBLIC_KEY_FILE=$RUNNER_TEMP/keys/public.pem" >> "$GITHUB_ENV"
          echo "ACE_RELEASE_PRIVATE_KEY_FILE=$RUNNER_TEMP/keys/private.pem" >> "$GITHUB_ENV"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" ace-signing.keychain-db
      - id: build
        run: node apps/desktop/scripts/pipeline/build.ts "$TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: staged-darwin-arm64
          path: ${{ steps.build.outputs.staged }}
          if-no-files-found: error
          retention-days: 14
      - name: Lock the keychain and remove the keys
        if: always()
        run: |
          security lock-keychain ace-signing.keychain-db || true
          rm -rf "$RUNNER_TEMP/keys"

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    needs: [gate, prepare]
    if: needs.prepare.outputs.linux-arches != '[]'
    runs-on: [self-hosted, linux, omarchy]
    environment: release
    # arm64 is built under emulation on omarchy's x86_64 CPU.
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.linux-arches) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Release keys
        env:
          PUBLIC_KEY: ${{ vars.ACE_RELEASE_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.ACE_RELEASE_PRIVATE_KEY }}
        run: |
          set -eu
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/keys/public.pem"
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/keys/private.pem"
      - name: Build in Debian 12, check on Ubuntu 24.04
        run: tools/release/linux/pipeline-build.sh "${{ matrix.arch }}" "$TAG" "$RUNNER_TEMP/keys"
      - uses: actions/upload-artifact@v7
        with:
          name: staged-linux-${{ matrix.arch }}
          path: dist/releases/${{ env.TAG }}
          if-no-files-found: error
          retention-days: 14
      - name: Remove the keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  build-windows:
    name: Build Windows x64
    needs: [gate, prepare]
    if: needs.prepare.outputs.build-windows == 'true'
    # An ARM64 VM: x64 Node and Bun run under emulation, so the whole build is x64.
    runs-on: [self-hosted, Windows, ace-win]
    environment: release
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      ACE_WINDOWS_PUBLISHER: ${{ vars.ACE_WINDOWS_PUBLISHER }}
      ACE_AZURE_SIGNING_ENDPOINT: ${{ vars.ACE_AZURE_SIGNING_ENDPOINT }}
      ACE_AZURE_SIGNING_ACCOUNT: ${{ vars.ACE_AZURE_SIGNING_ACCOUNT }}
      ACE_AZURE_CERTIFICATE_PROFILE: ${{ vars.ACE_AZURE_CERTIFICATE_PROFILE }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v${{ env.BUN_VERSION }}/bun-windows-x64.zip
      - run: bun install --frozen-lockfile
      - id: build
        run: node apps/desktop/scripts/pipeline/build.ts "$env:TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: staged-win32-x64
          path: ${{ steps.build.outputs.staged }}
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Upload the builds to the draft
    needs: [gate, prepare, build-mac, build-linux, build-windows]
    # Runs after a failed build too, so the builds that finished are kept for the rerun.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.published != 'true' }}
    runs-on: [self-hosted, linux, omarchy]
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: staged-*
          path: ${{ runner.temp }}/staged
      - name: Upload what this run built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          parts=""
          for folder in "$RUNNER_TEMP"/staged/staged-*; do
            [ -d "$folder" ] || continue
            parts="$parts ${folder##*/staged-}=$folder"
          done
          # One argument per platform; folder names never hold spaces.
          [ -z "$parts" ] || node apps/desktop/scripts/pipeline/upload.ts "$TAG" $parts
      - name: Fail when a build didn't finish
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A platform build didn't finish; rerun the failed jobs to build only what is missing."
          exit 1

  notes:
    name: Write the release notes
    needs: [gate, prepare]
    if: needs.prepare.outputs.published != 'true'
    runs-on: [self-hosted, linux, omarchy]
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # The agent runs on this machine's own logged-in CLI (the ace-ci user's), read-only.
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ needs.prepare.outputs.title }}
        run: node apps/desktop/scripts/pipeline/notes.ts "$TAG" "$TITLE"

  deploy-staging:
    name: Deploy staging
    needs: [gate, prepare, upload]
    if: ${{ !cancelled() && needs.upload.result == 'success' }}
    runs-on: [self-hosted, linux, omarchy]
    environment: staging
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # The cloud Workers to staging, smoke-tested; Workers already at this release are skipped.
      - run: bun run deploy:workers staging --version "$TAG"

  deploy-production:
    name: Deploy production
    needs: [gate, prepare, deploy-staging]
    # After every platform built and before publish, so the cloud is ready when apps update.
    if: ${{ !cancelled() && needs.deploy-staging.result == 'success' }}
    runs-on: [self-hosted, linux, omarchy]
    environment: production
    timeout-minutes: 30
    # Never two production deploys at once, whatever started them.
    concurrency:
      group: cloud-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CI: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Straight to 100% with a smoke check; rolls back to the previous Worker version on failure.
      - run: bun run deploy:workers production --version "$TAG"

  publish:
    name: Publish
    needs: [gate, prepare, upload, notes, deploy-production]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.published == 'true' || (needs.upload.result == 'success' && needs.notes.result == 'success' && needs.deploy-production.result == 'success')) }}
    runs-on: [self-hosted, linux, omarchy]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      # Live for everyone at once: stable marked latest, a beta as a prerelease for the Beta line.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node apps/desktop/scripts/pipeline/publish.ts "$TAG" "$VERSION"

  notify:
    name: Tell the owner
    needs:
      [
        gate,
        prepare,
        build-mac,
        build-linux,
        build-windows,
        upload,
        notes,
        deploy-staging,
        deploy-production,
        publish,
      ]
    # Only after the gate passed: notify runs the validated commit's code, nothing else.
    if: ${{ always() && needs.gate.result == 'success' }}
    runs-on: [self-hosted, linux, omarchy]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node apps/desktop/scripts/pipeline/notify.ts "$TAG" "$RUN_URL"
          gate prepare build-mac build-linux build-windows upload notes deploy-staging deploy-production publish
